name: Release builds

# Builds Linux and Windows packages, self-tests each packaged app, and publishes
# them to the GitHub release when a v* tag is pushed. Run it by hand to test a branch.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) keeps the Linux build compatible with older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt and Qt WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 \
            libasound2 libxshmfence1 libgbm1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Build environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-build.txt
      - name: Build, test and self-test
        run: ./build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Euro-Info-*-x86_64.tar.zst
            dist/SHA256SUMS-linux.txt
            dist/self-test-linux.json

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements-build.txt
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build, test and self-test
        shell: pwsh
        run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Euro-Info-*-windows-x64-setup.exe
            dist/Euro-Info-*-windows-x64.zip
            dist/SHA256SUMS-windows.txt
            dist/self-test-windows.json

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## [0-9]/{if(f)exit} f' CHANGELOG.md > notes.md
          cat artifacts/SHA256SUMS-linux.txt artifacts/SHA256SUMS-windows.txt > artifacts/SHA256SUMS.txt
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(artifacts/Euro-Info-* artifacts/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "Euro Info ${GITHUB_REF_NAME#v}" --notes-file notes.md "${files[@]}"
          fi
